<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Trip Planner</title>
<meta name="theme-color" content="#9a3412">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trip Planner">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f1e9;--card:#fffdf9;--ink:#1c1917;--muted:#78716c;--line:#e7dfd3;--soft:#f1ebe1;--accent:#c2410c;--accent-ink:#9a3412;--teal:#0f766e;--warn:#b45309;--warn-bg:#fef3c7;--bad:#b91c1c;--bad-bg:#fee2e2;--good:#15803d;--good-bg:#dcfce7;--r:12px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "DM Sans",system-ui,sans-serif}
h1,h2,h3{margin:0;font-weight:700}
h2{font:1.45rem "DM Serif Display",Georgia,serif;letter-spacing:.2px}
h3{font-size:1rem}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--teal)}
.hero{background:linear-gradient(115deg,#431407 0%,#9a3412 38%,#ea580c 72%,#f59e0b 100%);color:#fff7ed;padding:calc(22px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) 18px calc(20px + env(safe-area-inset-left));position:relative;overflow:hidden}
#fab{bottom:calc(18px + env(safe-area-inset-bottom))!important}
.hero:after{content:"";position:absolute;right:-40px;bottom:-60px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,#fde68a55,transparent 65%)}
.hero-in{max-width:1180px;margin:0 auto;display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;position:relative;z-index:1}
.hero h1{font:2rem/1.1 "DM Serif Display",Georgia,serif}
.hero .sub{opacity:.9;margin-top:4px}
.countdown{text-align:right}
.countdown b{font:2.2rem/1 "DM Serif Display",serif;display:block}
.curtog{display:inline-flex;background:#0003;border-radius:99px;padding:3px;margin-top:8px}
.curtog button{border:0;background:none;color:#fff;padding:4px 12px;border-radius:99px;cursor:pointer;font-weight:600;font-size:.85rem}
.curtog button.on{background:#fff;color:var(--accent-ink)}
.viewsel{background:#0003;color:#fff;border:0;border-radius:99px;padding:6px 12px;font-weight:600;font-size:.85rem;cursor:pointer}
.viewsel option{color:#1c1917}
.profile{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;background:#fff}
.qchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
nav{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.tabs{max-width:1180px;margin:0 auto;display:flex;overflow-x:auto;scrollbar-width:none;padding:0 12px}
.tabs a{padding:13px 14px;text-decoration:none;color:var(--muted);font-weight:600;white-space:nowrap;border-bottom:3px solid transparent}
.tabs a.on{color:var(--accent-ink);border-color:var(--accent)}
main{max-width:1180px;margin:0 auto;padding:20px 16px 110px}
.banner{max-width:1180px;margin:10px auto 0;padding:8px 14px;border-radius:10px;font-size:.9rem;background:var(--warn-bg);color:#78350f}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card h3{margin-bottom:10px}
.tile .lbl{color:var(--muted);font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.tile .val{font:1.75rem/1.15 "DM Serif Display",serif;margin-top:4px}
.tile .note{color:var(--muted);font-size:.85rem;margin-top:2px}
.tile.accent{background:linear-gradient(140deg,#fff7ed,#ffedd5);border-color:#fed7aa}
.sec{margin-top:22px}
.sec>.row{margin-bottom:10px}
.btn{border:1px solid var(--line);background:var(--card);padding:7px 13px;border-radius:9px;cursor:pointer;font-weight:600;font-size:.9rem;white-space:nowrap}
.btn:hover{border-color:#d6c8b4}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:var(--accent-ink)}
.btn.sm{padding:3px 9px;font-size:.8rem}
.btn.danger{color:var(--bad)}
.btn.ghost{border-color:transparent;background:none}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th{text-align:left;font-size:.75rem;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;padding:9px 10px;border-bottom:1px solid var(--line);background:var(--soft);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:#fbf6ee}
tfoot td{font-weight:700;background:var(--soft);border-top:1px solid var(--line)}
.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.nowrap{white-space:nowrap}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.75rem;font-weight:700;white-space:nowrap}
.p-Idea{background:#e7e5e4;color:#44403c}
.p-Booked{background:#dbeafe;color:#1e40af}
.p-Paid{background:var(--good-bg);color:var(--good)}
.p-Cancelled{background:var(--bad-bg);color:var(--bad);text-decoration:line-through}
.tag{display:inline-block;padding:1px 7px;border-radius:6px;font-size:.72rem;font-weight:700;background:var(--soft);color:var(--muted);margin-left:4px;vertical-align:1px}
.tag.auto{background:#ccfbf1;color:var(--teal)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0}
.ok{color:var(--good);font-weight:600}
.warn{color:var(--warn);font-weight:600}
.bad{color:var(--bad);font-weight:600}
.alert{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:.9rem}
.alert:last-child{border:0}
.alert .ic{flex:0 0 22px;text-align:center}
.bars .b{display:grid;grid-template-columns:150px 1fr 110px;gap:10px;align-items:center;margin:7px 0;font-size:.88rem}
.bar{height:16px;background:var(--soft);border-radius:5px;position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.bar i.act{height:6px;top:auto;bottom:0;background:#1c1917cc}
.chart{display:flex;align-items:flex-end;gap:3px;height:120px;padding-top:6px}
.chart .c{flex:1;background:#fdba74;border-radius:3px 3px 0 0;min-height:2px;position:relative}
.chart .c.long{background:var(--accent)}
.chart .c.zero{background:var(--line)}
.chart-x{display:flex;gap:3px;font-size:.65rem;color:var(--muted);margin-top:3px}
.chart-x span{flex:1;text-align:center;overflow:hidden}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:4px 11px;font-size:.82rem;font-weight:600;cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.person{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line)}
.person:last-child{border:0}
.daybk{padding:3px 7px;margin:2px 0;border-radius:7px;background:var(--soft);cursor:pointer;display:inline-block}
.daybk:hover{background:#efe6d8}
.day-long td:first-child{box-shadow:inset 3px 0 var(--accent)}
.day-missing td{background:repeating-linear-gradient(135deg,#fff,#fff 8px,#faf5ee 8px,#faf5ee 16px);color:var(--muted)}
.chk{width:18px;height:18px;accent-color:var(--teal);cursor:pointer}
.task-done td{color:var(--muted);text-decoration:line-through}
.empty{padding:28px;text-align:center;color:var(--muted)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
.field label{display:block;font-size:.78rem;font-weight:700;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px}
.field input:not([type=checkbox]),.field select,.field textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.field textarea{min-height:70px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid #fdba74;border-color:#fdba74}
.field .hint{font-size:.78rem;color:var(--muted);margin-top:3px}
.cbline{display:flex;gap:8px;align-items:center;font-size:.9rem}
.splitbox{display:flex;gap:12px;flex-wrap:wrap}
#modal{position:fixed;inset:0;z-index:50;background:#1c191766;display:flex;align-items:flex-start;justify-content:center;padding:5vh 12px;overflow-y:auto}
#modal[hidden]{display:none}
.dialog{background:var(--card);border-radius:16px;max-width:640px;width:100%;padding:20px;box-shadow:0 20px 60px #0004}
.dialog h2{margin-bottom:14px}
.dialog .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.dialog .foot .left{margin-right:auto}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:10px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
#toast.show{opacity:1}
#fab{position:fixed;right:18px;bottom:18px;z-index:30;border:0;background:var(--accent);color:#fff;font-weight:700;padding:13px 18px;border-radius:99px;box-shadow:0 8px 24px #9a341255;cursor:pointer}
#fab[hidden]{display:none}
.setup .field{margin-bottom:12px}
.trav{display:flex;gap:8px;margin-bottom:8px}
.trav input{flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
textarea.code{width:100%;min-height:220px;font:12px/1.4 ui-monospace,Menlo,monospace;padding:10px;border:1px solid var(--line);border-radius:8px}
.dp{position:relative}
.dp-btn{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}
.dp-btn:hover,.dp-btn.open{border-color:#fdba74;outline:2px solid #fed7aa}
#dp{position:fixed;z-index:70;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 40px #0003;padding:10px;width:286px}
#dp[hidden]{display:none}
.dp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.dp-head b{font-size:.95rem}
.dp-head button,.dp-foot button{border:1px solid var(--line);background:var(--card);border-radius:8px;cursor:pointer;font-weight:600}
.dp-head button{width:34px;height:30px;font-size:1.1rem}
.dp-wd,.dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.dp-wd span{font-size:.7rem;color:var(--muted);font-weight:700;padding:3px 0}
.dp-grid button{height:34px;border:0;background:none;border-radius:8px;cursor:pointer;font-size:.88rem}
.dp-grid button:hover{background:var(--soft)}
.dp-grid button.trip{background:#fff7ed;color:var(--accent-ink)}
.dp-grid button.today{box-shadow:inset 0 0 0 1.5px var(--teal)}
.dp-grid button.sel{background:var(--accent);color:#fff;font-weight:700}
.dp-foot{display:flex;gap:6px;justify-content:space-between;margin-top:8px}
.dp-foot button{padding:4px 10px;font-size:.8rem}
@media (max-width:640px){.form{grid-template-columns:1fr}.bars .b{grid-template-columns:100px 1fr 80px}.hero h1{font-size:1.6rem}.countdown{text-align:left}}
</style>
</head>
<body>
<header class="hero"><div class="hero-in" id="hero"></div></header>
<nav><div class="tabs" id="tabs"></div></nav>
<div id="banner"></div>
<main id="main"><div class="empty">Loading your trip…</div></main>
<div id="modal" hidden></div>
<div id="toast"></div>
<div id="dp" hidden></div>
<button id="fab" hidden>+ Expense</button>
<script src="firebase-config.js"></script>
<script src="fb.js"></script>
<script>
"use strict";
/* ---------- constants ---------- */
const CATS=[
 {k:'Flights',c:'#2563eb'},{k:'Accommodation',c:'#7c3aed'},{k:'Car & Fuel',c:'#c2410c'},
 {k:'Food & Drink',c:'#d97706'},{k:'Activities & Parks',c:'#059669'},{k:'Wedding',c:'#db2777'},
 {k:'Shopping',c:'#0891b2'},{k:'Insurance & Admin',c:'#64748b'},{k:'Other',c:'#a8a29e'}];
const CATC=Object.fromEntries(CATS.map(c=>[c.k,c.c]));
const BTYPES=['Flight','Hotel','Car hire','Activity','Food','Wedding','Other'];
const BTYPE_CAT={Flight:'Flights',Hotel:'Accommodation','Car hire':'Car & Fuel',Activity:'Activities & Parks',Food:'Food & Drink',Wedding:'Wedding',Other:'Other'};
const BICON={Flight:'✈️',Hotel:'🛏️','Car hire':'🚗',Activity:'🎟️',Food:'🍽️',Wedding:'💍',Other:'📌'};
const STATUSES=['Idea','Booked','Paid','Cancelled'];
const COLS=['days','bookings','budget','expenses','tasks'];
const TABS=[['overview','Overview'],['itinerary','Itinerary'],['bookings','Bookings & hotels'],['forecast','Cost forecast'],['expenses','Expenses'],['settle','Per person & settle up'],['checklist','Checklist'],['setup','Trip setup']];
const DEFAULT_SETTINGS={name:'USA Road Trip',start:'2027-06-01',end:'2027-07-01',travellers:[{id:'t1',name:'Traveller 1',party:'p1'}],parties:[{id:'p1',name:''}],audPerUsd:1.45,fuelPrice:4.6,mpg:25,localPct:15,nightEst:200,longDrive:5,fuelSplitBy:'person'};
const SPLITBY_OPT=[['person','Equally per person'],['party','Equally per profile (a couple pays one share)']];

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0};
const D=s=>{if(!s||!/^\d{4}-\d\d-\d\d$/.test(s))return null;const[y,m,d]=s.split('-').map(Number);return new Date(Date.UTC(y,m-1,d))};
const iso=d=>d.toISOString().slice(0,10);
const addD=(s,n)=>{const d=D(s);if(!d)return '';d.setUTCDate(d.getUTCDate()+n);return iso(d)};
const diffD=(a,b)=>Math.round((D(b)-D(a))/864e5);
const WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fd=s=>{const d=D(s);return d?`${WD[d.getUTCDay()]} ${d.getUTCDate()} ${MO[d.getUTCMonth()]}`:''};
const fdy=s=>{const d=D(s);return d?`${d.getUTCDate()} ${MO[d.getUTCMonth()]} ${d.getUTCFullYear()}`:''};
const todayISO=()=>{const n=new Date();return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`};
const safeUrl=u=>/^https?:\/\//i.test(u||'')?u:'';
const lsGet=k=>{try{return localStorage.getItem('trip.'+k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem('trip.'+k,v)}catch(e){}};
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2600)}

/* ---------- state ---------- */
let S={settings:null,days:[],bookings:[],budget:[],expenses:[],tasks:[]};
let mode='loading', db=null, readOnly=false, stale=false;
const got={};
let dispCur=lsGet('disp')||'AUD';
let tab=(location.hash||'#overview').slice(1); if(!TABS.some(t=>t[0]===tab))tab='overview';
const F={bType:'',bStatus:'',eCat:'',eWho:''};

const ST=()=>Object.assign({},DEFAULT_SETTINGS,S.settings||{});
const T=()=>ST().travellers||[];
const tname=id=>(T().find(t=>t.id===id)||{}).name||'—';
const fx=()=>num(ST().audPerUsd)||1.45;
function conv(a,cur){a=num(a);if(!cur||cur===dispCur)return a;return cur==='USD'?a*fx():a/fx()}
function money(v,dec=0){const p=dispCur==='AUD'?'A$':'US$';const n=Math.abs(v);return (v<0?'−':'')+p+n.toLocaleString('en-AU',{minimumFractionDigits:dec,maximumFractionDigits:dec})}
function orig(a,cur){return (cur==='AUD'?'A$':'US$')+num(a).toLocaleString('en-AU',{maximumFractionDigits:2})}
function splitOf(item){const ids=T().map(t=>t.id);const s=(item.split||[]).filter(x=>ids.includes(x));return s.length?s:ids}
/* profiles (parties): a couple travelling together, or a single traveller */
function partyOf(tid){const t=T().find(x=>x.id===tid);if(!t)return null;return t.party&&(ST().parties||[]).some(p=>p.id===t.party)?t.party:'solo-'+tid}
function P(){const ps=ST().parties||[];return [...new Set(T().map(t=>partyOf(t.id)))].map(id=>({id,name:(ps.find(p=>p.id===id)||{}).name||''}))}
function members(pid){return T().filter(t=>partyOf(t.id)===pid).map(t=>t.id)}
function pname(pid){const p=P().find(x=>x.id===pid);return (p&&p.name)||members(pid).map(tname).join(' & ')||'—'}
function partiesIn(ids){return [...new Set(ids.map(partyOf).filter(Boolean))]}
function splitLabel(item){const s=splitOf(item);let l;if(s.length===T().length)l='Everyone';else{const ps=partiesIn(s);l=ps.every(p=>members(p).every(id=>s.includes(id)))?ps.map(pname).join(' + '):s.map(tname).join(', ')}return l+(item.splitBy==='party'&&partiesIn(s).length>1?' · per profile':'')}
function normSettings(st){st={...st};const ts=(st.travellers||[]).map(t=>({...t,party:partyOf(t.id)||t.party||('solo-'+t.id)}));const old=Object.fromEntries((st.parties||[]).map(p=>[p.id,p]));
  st.travellers=ts;st.parties=[...new Set(ts.map(t=>t.party))].map(id=>({...(old[id]||{}),id,name:(old[id]||{}).name||''}));return st}
let viewP=lsGet('view')||'';
const VP=()=>P().some(p=>p.id===viewP)?viewP:'';

/* ---------- storage ---------- */
const chains={};
function pathFor(col,id){return col==='settings'?'trip/settings':`${col}/${id}`}
function handleErr(e){
  const code=e&&e.code;
  if(code==='invalid_argument'||code==='not_granted'){readOnly=true;toast('You have view-only access to this trip');render(true)}
  else if(code==='quota_exceeded')toast('Storage is full — delete some old entries');
  else toast('Could not save — check your connection');
  console.warn(e);
}
function save(col,obj){
  if(readOnly){toast('View-only access');return}
  const clean=JSON.parse(JSON.stringify(obj));const id=clean.id||uid();delete clean.id;
  if(col==='settings'){S.settings=clean}else{const arr=S[col];const i=arr.findIndex(x=>x.id===id);const rec={...clean,id};if(i>=0)arr[i]=rec;else arr.push(rec)}
  if(mode==='db'){
    const p=pathFor(col,id);
    const run=()=>db.doc(p).set(clean).catch(e=>{if(e&&e.code==='unavailable')return new Promise(r=>setTimeout(r,400+Math.random()*600)).then(()=>db.doc(p).set(clean));throw e});
    chains[p]=(chains[p]||Promise.resolve()).then(run).catch(handleErr);
  }else persistLocal();
  render();
}
function remove(col,id){
  if(readOnly){toast('View-only access');return}
  S[col]=S[col].filter(x=>x.id!==id);
  if(mode==='db'){const p=pathFor(col,id);chains[p]=(chains[p]||Promise.resolve()).then(()=>db.doc(p).delete()).catch(handleErr)}
  else persistLocal();
  render();
}
function persistLocal(){lsSet('data',JSON.stringify(S))}
function startLocal(reason){
  mode='local';
  try{const d=JSON.parse(lsGet('data')||'null');if(d)S=Object.assign(S,d)}catch(e){}
  $('#banner').innerHTML=`<div class="banner">${esc(reason)} Changes are being saved in this browser only.</div>`;
  render(true);
}
async function init(){
  render(true);
  if(!window.TripCloud||!TripCloud.configured){startLocal('The sync database isn’t set up yet.');return}
  if(!TripCloud.tripId()){mode='landing';render(true);return}
  try{db=await window.claude.use('db')}catch(e){db=null}
  if(!db){startLocal('Couldn’t open the sync database.');return}
  mode='db';
  try{const user=await window.claude.use('user');if(user&&user.can){const c=await user.can('data.write');if(c===false)readOnly=true}}catch(e){}
  const timer=setTimeout(()=>{stale=true;render(true)},10000);
  const mark=(k,meta)=>{got[k]=got[k]||!meta.fromCache;if(['settings',...COLS].every(x=>got[x])){clearTimeout(timer);stale=false}};
  const onErr=e=>{clearTimeout(timer);if(e&&e.code==='revoked'){readOnly=true}console.warn(e);render(true)};
  db.doc('trip/settings').onSnapshot(s=>{S.settings=s.exists?{...s.data()}:null;got.settingsAny=true;mark('settings',s.metadata);render()},onErr);
  COLS.forEach(c=>db.collection(c).onSnapshot(q=>{S[c]=q.docs.map(d=>({...d.data(),id:d.id}));got[c+'Any']=true;mark(c,q.metadata);render()},onErr));
}

/* ---------- computations ---------- */
const sortDays=()=>[...S.days].sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.order||0)-(b.order||0));
const totalMiles=()=>S.days.reduce((s,d)=>s+num(d.miles),0);
const totalHours=()=>S.days.reduce((s,d)=>s+num(d.hours),0);
function hotelsFor(date){return S.bookings.filter(b=>b.type==='Hotel'&&b.status!=='Cancelled'&&b.start&&b.end&&b.start<=date&&date<b.end)}
/* each night: which profiles still have no room booked */
function nightsInfo(){
  const st=ST();const out=[];
  sortDays().forEach(d=>{if(!d.date||d.date>=st.end)return;const hotels=hotelsFor(d.date);if(!d.night&&!hotels.length)return;const night=d.night||hotels[0].location||hotels[0].title;const cov=new Set();hotels.forEach(h=>splitOf(h).forEach(id=>cov.add(partyOf(id))));
    const missing=d.noHotel?[]:P().map(p=>p.id).filter(p=>!cov.has(p));out.push({day:d,night,hotels,missing,need:missing.length>0})});
  return out;
}
function fuelCalc(){const st=ST();const mi=totalMiles()*(1+num(st.localPct)/100);const gal=num(st.mpg)?mi/num(st.mpg):0;return{mi,gal,usd:gal*num(st.fuelPrice)}}
function forecast(){
  const st=ST();const items=[];
  S.bookings.forEach(b=>{if(b.status==='Cancelled')return;items.push({src:'booking',id:b.id,cat:BTYPE_CAT[b.type]||'Other',label:b.title||b.type,kind:'fixed',on:true,amt:conv(b.cost,b.cur),split:splitOf(b),splitBy:b.splitBy,status:b.status,ref:b})});
  S.bookings.forEach(b=>{if(b.status==='Cancelled'||b.type!=='Hotel'||b.breakfast!=='fee'||!b.bfAdd||!num(b.bfFee)||!b.start||!b.end)return;const nights=Math.max(0,diffD(b.start,b.end));const sp=splitOf(b);if(!nights)return;
    items.push({src:'booking',id:b.id,cat:'Food & Drink',label:'Breakfast — '+(b.title||'hotel'),kind:'fixed',on:true,amt:conv(num(b.bfFee)*nights*sp.length,b.cur),split:sp,splitBy:'person',status:b.status,ref:b,calc:`${orig(b.bfFee,b.cur)} pp × ${nights} night${nights>1?'s':''} × ${sp.length} ${sp.length>1?'people':'person'}`})});
  S.budget.forEach(l=>{const own=l.owner&&P().some(p=>p.id===l.owner)?l.owner:null;
    if(own){const mem=members(own);const n=l.per==='person'?mem.length:1;const q=l.qty===undefined||l.qty===''?1:num(l.qty);
      items.push({src:'budget',id:l.id,owner:own,cat:l.cat||'Other',label:l.item,kind:l.kind==='optional'?'optional':'fixed',on:l.kind==='optional'?l.on!==false:true,amt:conv(num(l.amount)*q*n,l.cur),split:mem,splitBy:'person',ref:l,
        calc:`${orig(l.amount,l.cur)}${q!==1?' × '+q:''}${n>1?' × '+n+' people':''}`});return}
    const per=perOf(l);const sp=splitOf(l);const n=per==='person'?sp.length:per==='party'?partiesIn(sp).length:1;const q=l.qty===undefined||l.qty===''?1:num(l.qty);
    items.push({src:'budget',id:l.id,cat:l.cat||'Other',label:l.item,kind:l.kind==='optional'?'optional':'fixed',on:l.kind==='optional'?l.on!==false:true,amt:conv(num(l.amount)*q*n,l.cur),split:sp,splitBy:per==='party'?'party':l.splitBy,ref:l,
    calc:`${orig(l.amount,l.cur)}${q!==1?' × '+q:''}${per==='person'?' × '+n+' people':per==='party'?' × '+n+' profile'+(n>1?'s':''):''}`})});
  const f=fuelCalc();
  if(f.usd>0)items.push({src:'auto',id:'fuel',cat:'Car & Fuel',label:'Fuel (from itinerary miles)',kind:'fixed',on:true,amt:conv(f.usd,'USD'),split:T().map(t=>t.id),splitBy:st.fuelSplitBy==='party'?'party':'person',
    calc:`${Math.round(totalMiles()).toLocaleString()} mi + ${num(st.localPct)}% local ÷ ${num(st.mpg)} mpg × US$${num(st.fuelPrice).toFixed(2)}/gal`});
  const ni=nightsInfo();
  P().forEach(p=>{const unb=ni.filter(x=>x.missing.includes(p.id)).length;const est=nightEstFor(p.id);if(unb>0)items.push({src:'auto',id:'nights-'+p.id,cat:'Accommodation',label:`Hotels not yet booked — ${pname(p.id)} (${unb} night${unb>1?'s':''})`,kind:'fixed',on:true,amt:conv(unb*est,'USD'),split:members(p.id),
    calc:`${unb} nights × US$${est} per room — shrinks as rooms are booked`})});
  return items;
}
function nightEstFor(pid){const p=(ST().parties||[]).find(x=>x.id===pid);return p&&num(p.nightEst)?num(p.nightEst):num(ST().nightEst)}
function perOf(l){return l.per!==undefined?l.per:(l.perPerson?'person':'')}
function totals(items){
  const t={fixed:0,optOn:0,optAll:0,committed:0};
  items.forEach(i=>{if(i.kind==='fixed')t.fixed+=i.amt;else{t.optAll+=i.amt;if(i.on)t.optOn+=i.amt}if(i.src==='booking'&&(i.status==='Booked'||i.status==='Paid')&&(i.kind==='fixed'||i.on))t.committed+=i.amt});
  t.planned=t.fixed+t.optOn;return t;
}
/* who pays what for one item: per person, or each profile an equal share then split inside the profile */
function itemShares(i){const m={};const s=(i.split||[]).filter(id=>partyOf(id));if(!s.length)return m;
  if(i.splitBy==='party'){const ps=partiesIn(s);ps.forEach(pid=>{const mem=s.filter(id=>partyOf(id)===pid);mem.forEach(id=>m[id]=(m[id]||0)+i.amt/ps.length/mem.length)})}
  else s.forEach(id=>m[id]=(m[id]||0)+i.amt/s.length);return m}
function shares(items){const m={};T().forEach(t=>m[t.id]=0);items.forEach(i=>{const sh=itemShares(i);for(const k in sh)if(k in m)m[k]+=sh[k]});return m}
function byParty(m){const o={};P().forEach(p=>o[p.id]=0);for(const k in m){const p=partyOf(k);if(p in o)o[p]+=m[k]}return o}
const partyShare=(i,pid)=>{const sh=itemShares(i);return members(pid).reduce((s,id)=>s+(sh[id]||0),0)};
/* when viewing one profile, every cost becomes that profile's share (full cost kept as .full) */
function scope(items){const V=VP();if(!V)return items;return items.map(i=>({...i,full:i.amt,amt:partyShare(i,V)})).filter(i=>i.amt>0.005)}
function expShare(e){const V=VP();return V?partyShare(expItem(e),V):expAmt(e)}
function bookShare(b){const V=VP();const c=conv(b.cost,b.cur);return V?partyShare({amt:c,split:splitOf(b),splitBy:b.splitBy},V):c}
const planItems=items=>items.filter(i=>i.kind==='fixed'||i.on);
const expAmt=e=>conv(e.amount,e.cur);
const spentTotal=()=>S.expenses.reduce((s,e)=>s+expAmt(e),0);
function bookingPaid(b){return S.expenses.filter(e=>e.bookingId===b.id).reduce((s,e)=>s+expAmt(e),0)}
const expItem=e=>({amt:expAmt(e),split:splitOf(e),splitBy:e.splitBy});
/* balances per profile: a couple's payments and shares are pooled */
function balances(){
  const m={};P().forEach(p=>m[p.id]={paid:0,share:0});
  S.expenses.forEach(e=>{const a=expAmt(e);const pp=partyOf(e.paidBy);if(m[pp])m[pp].paid+=a;const sh=itemShares(expItem(e));for(const id in sh){const p=partyOf(id);if(m[p])m[p].share+=sh[id]}});
  return m;
}
function paidByPerson(){const m={};T().forEach(t=>m[t.id]=0);S.expenses.forEach(e=>{if(e.paidBy in m)m[e.paidBy]+=expAmt(e)});return m}
function settleUp(){
  const b=balances();const pos=[],neg=[];
  Object.entries(b).forEach(([id,v])=>{const n=v.paid-v.share;if(n>0.5)pos.push({id,n});else if(n<-0.5)neg.push({id,n:-n})});
  pos.sort((a,b)=>b.n-a.n);neg.sort((a,b)=>b.n-a.n);const tx=[];
  let i=0,j=0;while(i<neg.length&&j<pos.length){const x=Math.min(neg[i].n,pos[j].n);tx.push({from:neg[i].id,to:pos[j].id,amt:x});neg[i].n-=x;pos[j].n-=x;if(neg[i].n<0.5)i++;if(pos[j].n<0.5)j++}
  return tx;
}
const miKm=mi=>`${Math.round(mi).toLocaleString()} mi <span class="muted">· ${Math.round(mi*1.609).toLocaleString()} km</span>`;
const hrs=h=>{h=num(h);if(!h)return '';const H=Math.floor(h),M=Math.round((h-H)*60);return `${H}h${M?(' '+M+'m'):''}`};
const mapUrl=(a,b)=>`https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(a)}&destination=${encodeURIComponent(b)}&travelmode=driving`;

function focusInMain(){const a=document.activeElement;return a&&$('#main').contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)}

function doRender(){
  renderHero();

  <div class="curtog" style="margin:0">${['AUD','USD'].map(c=>`<button data-act="cur" data-v="${c}" class="${dispCur===c?'on':''}">${c}</button>`).join('')}</div></div></div>`;

/* Itinerary */

  const st=ST();const days=sortDays();const rows=[];const seen=new Set(days.map(d=>d.date));

    const dn=D(st.start)&&d.date?diffD(st.start,d.date)+1:'';
    if(d.missing){rows.push(`<tr class="day-missing"><td>${dn}</td><td class="nowrap">${fd(d.date)}</td><td colspan="5">Nothing planned <button class="btn sm" data-act="new-day" data-date="${d.date}">+ Plan this day</button></td></tr>`);return}
    const ni=NI[d.id];let hc='';
    if(!ni)hc='<span class="muted">—</span>';else if(d.noHotel)hc='<span class="muted">Not needed</span>';
    else{const hs=V?ni.hotels.filter(h=>splitOf(h).some(id=>partyOf(id)===V)):ni.hotels;const miss=V?ni.missing.filter(p=>p===V):ni.missing;

function stayTags(b){if(b.type!=='Hotel')return '';const k={hotel:'🏨 Hotel',airbnb:'🏠 Airbnb',camping:'⛺ Camping',other:'🏡 Other'}[b.stayKind]||'';
  const bf=b.breakfast==='incl'?'🍳 Breakfast incl.':b.breakfast==='fee'?`🍳 Breakfast ${num(b.bfFee)?orig(b.bfFee,b.cur)+' pp':'extra'}${b.bfAdd?' (costed)':''}`:'';
  return [k,bf].filter(Boolean).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}
const STAY_ROWS=[['hotel','🏨 Hotel / motel'],['airbnb','🏠 Airbnb'],['camping','⛺ Camping'],['other','🏡 Other'],['none','🚫 No bed needed'],['unbooked','⚠️ Not booked yet'],['unplanned','📅 Not planned yet']];
function stayTally(){const st=ST();const ni=nightsInfo();const total=D(st.start)&&D(st.end)?diffD(st.start,st.end):ni.length;const per={};
  P().forEach(p=>{const t=Object.fromEntries(STAY_ROWS.map(r=>[r[0],0]));ni.forEach(x=>{let c;if(x.day.noHotel)c='none';else{const h=x.hotels.find(h=>splitOf(h).some(id=>partyOf(id)===p.id));c=h?(h.stayKind||'hotel'):'unbooked'}t[c]++});t.unplanned=Math.max(0,total-ni.length);per[p.id]=t});
  return {per,total}}
function vStayCard(V){const {per,total}=stayTally();const cols=V?[V]:P().map(p=>p.id);

  <div class="tbl-wrap"><table><thead><tr><th></th>${cols.map(c=>`<th class="num">${V?'Nights':esc(pname(c))}</th>`).join('')}</tr></thead><tbody>
  ${rows.map(([k,l])=>`<tr><td>${l}</td>${cols.map(c=>`<td class="num ${k==='unbooked'&&per[c][k]?'warn':''}">${per[c][k]||'<span class="muted">0</span>'}</td>`).join('')}</tr>`).join('')}
  </tbody></table></div><div class="muted small" style="margin-top:6px">From your accommodation bookings and their type. Untyped hotel bookings count as Hotel / motel. “Not planned yet” means days with no overnight town set.</div></div>`}

let modalState=null;
function fieldHtml(fd_,v){
  const id='f_'+fd_.k;const full=fd_.full?'full':'';
  if(fd_.type==='checkbox')return `<div class="field ${full}"><label class="cbline"><input type="checkbox" class="chk" id="${id}" ${v?'checked':''}> ${fd_.label}</label>${fd_.hint?`<div class="hint">${fd_.hint}</div>`:''}</div>`;
  if(fd_.type==='split'){const s=(v&&v.length)?v:T().map(t=>t.id);
    return `<div class="field full"><label>${fd_.label||'Split between'}</label><div class="qchips"><span class="chip" data-q="" data-for="${id}">Everyone</span>${P().map(p=>`<span class="chip" data-q="${esc(p.id)}" data-for="${id}">${esc(pname(p.id))} only</span>`).join('')}</div>
    <div class="splitbox">${P().map(p=>`<span style="display:inline-flex;gap:10px;padding:4px 10px;border:1px dashed var(--line);border-radius:8px">${members(p.id).map(tid=>`<label class="cbline"><input type="checkbox" class="chk" name="${id}" value="${tid}" ${s.includes(tid)?'checked':''}> ${esc(tname(tid))}</label>`).join('')}</span>`).join('')}</div></div>`}
  let inp;
  if(fd_.type==='select'){const opts=typeof fd_.opts==='function'?fd_.opts():fd_.opts;inp=`<select id="${id}">${opts.map(o=>{const[val,lab]=Array.isArray(o)?o:[o,o];return `<option value="${esc(val)}" ${String(v??'')===String(val)?'selected':''}>${esc(lab)}</option>`}).join('')}</select>`}
  else if(fd_.type==='date')inp=dateField(id,v);
  else if(fd_.type==='textarea')inp=`<textarea id="${id}" placeholder="${esc(fd_.ph||'')}">${esc(v)}</textarea>`;
  else inp=`<input id="${id}" type="${fd_.type||'text'}" ${fd_.step?`step="${fd_.step}"`:''} ${fd_.type==='number'?'inputmode="decimal"':''} placeholder="${esc(fd_.ph||'')}" value="${esc(v)}">`;
  return `<div class="field ${full}"><label for="${id}">${fd_.label}</label>${inp}${fd_.hint?`<div class="hint">${fd_.hint}</div>`:''}</div>`;
}
function openForm({title,fields,data,onSave,onDelete,extraBtn}){
  modalState={fields,data,onSave,onDelete};
  const m=$('#modal');m.hidden=false;
  m.innerHTML=`<div class="dialog" role="dialog" aria-modal="true"><h2>${esc(title)}</h2><form id="mform" class="form">${fields.map(f=>f.show?`<div data-show='${esc(JSON.stringify(f.show))}' style="display:contents">${fieldHtml(f,data[f.k])}</div>`:fieldHtml(f,data[f.k])).join('')}</form>
  <div class="foot">${onDelete?'<button class="btn danger left" data-m="del">Delete</button>':''}${extraBtn?`<button class="btn" data-m="extra">${extraBtn.label}</button>`:''}<button class="btn" data-m="cancel">Cancel</button><button class="btn pri" data-m="save">Save</button></div></div>`;
  modalState.extra=extraBtn&&extraBtn.fn;
  const sync=()=>m.querySelectorAll('[data-show]').forEach(w=>{const c=JSON.parse(w.dataset.show);w.style.display=Object.entries(c).every(([k,v])=>{const el=document.getElementById('f_'+k);return el&&el.value===v})?'contents':'none'});
  sync();m.querySelector('#mform').addEventListener('change',sync);
  const first=m.querySelector("input:not([type=checkbox]):not([type=hidden]),select,textarea");if(first&&window.innerWidth>640)first.focus();
}
function readForm(){
  const out={...modalState.data};
  modalState.fields.forEach(f=>{const id='f_'+f.k;
    if(f.type==='checkbox')out[f.k]=$('#'+id).checked;
    else if(f.type==='split'){const ch=[...document.querySelectorAll(`input[name="${id}"]:checked`)].map(x=>x.value);out[f.k]=ch.length===T().length?[]:ch}
    else if(f.type==='number'){const v=$('#'+id).value;out[f.k]=v===''?'':num(v)}
    else out[f.k]=$('#'+id).value.trim()});
  return out;
}
function closeModal(){$('#modal').hidden=true;$('#modal').innerHTML='';modalState=null;if(pending){pending=false;render(true)}}
$('#modal').addEventListener('click',e=>{
  if(e.target.id==='modal'){closeModal();return}
  const q=e.target.closest('[data-q]');if(q){const want=q.dataset.q?members(q.dataset.q):T().map(t=>t.id);document.querySelectorAll(`input[name="${q.dataset.for}"]`).forEach(c=>c.checked=want.includes(c.value));return}
  const b=e.target.closest('[data-m]');if(!b)return;const a=b.dataset.m;
  if(a==='cancel')closeModal();
  else if(a==='save'){const d=readForm();const r=modalState.onSave(d);if(r!==false)closeModal()}
  else if(a==='del'){if(b.dataset.sure){modalState.onDelete();closeModal()}else{b.dataset.sure=1;b.textContent='Click again to delete'}}
  else if(a==='extra'){const d=readForm();modalState.extra(d)}
});

  if(el.dataset.act==='f-ecat'){F.eCat=el.value;render(true);return}
  if(el.dataset.act==='f-ewho'){F.eWho=el.value;render(true);return}
  if(el.dataset.set){const st=ST();const k=el.dataset.set;let v=el.value;if(el.type==='number')v=num(v);if(st[k]===v)return;save('settings',{...st,[k]:v});return}
  if(el.dataset.trav){const st=normSettings(ST());save('settings',{...st,travellers:st.travellers.map(t=>t.id===el.dataset.trav?{...t,name:el.value.trim()||t.name}:t)});return}
  if(el.dataset.pest!==undefined){const st=normSettings(ST());const v=el.value===''?'':num(el.value);save('settings',{...st,parties:st.parties.map(p=>p.id===el.dataset.pest?{...p,nightEst:v}:p)});return}
  if(el.dataset.pname!==undefined){const st=normSettings(ST());save('settings',{...st,parties:st.parties.map(p=>p.id===el.dataset.pname?{...p,name:el.value.trim()}:p)});return}
  if(el.dataset.act==='view'){viewP=el.value;lsSet('view',viewP);render(true);return}
});
function copyText(txt,msg){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>toast(msg),()=>toast('Copy blocked — select the text and copy manually'))}else toast('Copy blocked — select the text and copy manually')}
function showText(title,html,btns){
  const m=$('#modal');m.hidden=false;modalState={fields:[],data:{},onSave:()=>{}};
  m.innerHTML=`<div class="dialog"><h2>${esc(title)}</h2>${html}<div class="foot">${btns.map((b,i)=>`<button class="btn ${i===btns.length-1?'pri':''}" data-tb="${i}">${b[0]}</button>`).join('')}<button class="btn" data-m="cancel">Close</button></div></div>`;
  m.querySelectorAll('[data-tb]').forEach(b=>b.addEventListener('click',()=>btns[+b.dataset.tb][1]()));
}
async function doImport(){
  let d;try{d=JSON.parse($('#imp').value)}catch(e){toast('That isn’t valid JSON');return}
  if(!d||typeof d!=='object'){toast('Nothing to import');return}
  closeModal();
  if(d.settings)save('settings',d.settings);
  let n=0;for(const c of COLS){if(Array.isArray(d[c]))for(const r of d[c]){if(r&&r.id&&typeof r==='object'){save(c,r);n++;if(mode==='db'&&n%20===0)await new Promise(r=>setTimeout(r,500))}}}
  toast(`Imported ${n} entries`);
}
/* ---------- calendar drop-down for every date box ---------- */
const fdl=s=>{const d=D(s);return d?`${WD[d.getUTCDay()]} ${d.getUTCDate()} ${MO[d.getUTCMonth()]} ${d.getUTCFullYear()}`:''};
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
function dateField(id,val,attrs=''){return `<div class="dp"><input type="hidden" id="${id}" value="${esc(val||'')}" ${attrs}><button type="button" class="dp-btn" data-dp="${id}" aria-haspopup="dialog">${val&&D(val)?esc(fdl(val)):'<span class="muted">Pick a date</span>'}<span aria-hidden="true">📅</span></button></div>`}
let dpS=null;const dpEl=$('#dp');
function dpBtn(){return dpS&&(dpS.btn.isConnected?dpS.btn:document.querySelector(`[data-dp="${dpS.id}"]`))}
function openDP(btn){const id=btn.dataset.dp;const inp=document.getElementById(id);if(!inp)return;
  const base=D(ST().start)||D(inp.value)||D(todayISO());if(dpS)dpBtn()?.classList.remove('open');
  dpS={id,btn,y:base.getUTCFullYear(),m:base.getUTCMonth()};btn.classList.add('open');renderDP();dpEl.hidden=false;placeDP();}
function closeDP(){if(!dpS)return;dpBtn()?.classList.remove('open');dpS=null;dpEl.hidden=true}
function placeDP(){const b=dpBtn();if(!b){closeDP();return}const r=b.getBoundingClientRect();const w=dpEl.offsetWidth,h=dpEl.offsetHeight;
  let left=Math.min(Math.max(8,r.left),window.innerWidth-w-8);let top=r.bottom+6;if(top+h>window.innerHeight-8&&r.top-h-6>8)top=r.top-h-6;
  dpEl.style.left=left+'px';dpEl.style.top=Math.max(8,top)+'px'}
function renderDP(){const {y,m,id}=dpS;const sel=(document.getElementById(id)||{}).value||'';const st=ST();const td=todayISO();const p2=n=>String(n).padStart(2,'0');
  const off=(new Date(Date.UTC(y,m,1)).getUTCDay()+6)%7;const n=new Date(Date.UTC(y,m+1,0)).getUTCDate();let cells='';
  for(let i=0;i<off;i++)cells+='<span></span>';
  for(let d=1;d<=n;d++){const iso=`${y}-${p2(m+1)}-${p2(d)}`;const trip=st.start&&st.end&&iso>=st.start&&iso<=st.end;cells+=`<button type="button" data-dpd="${iso}" class="${iso===sel?'sel':''} ${iso===td?'today':''} ${trip?'trip':''}" aria-label="${fdl(iso)}">${d}</button>`}
  dpEl.innerHTML=`<div class="dp-head"><button type="button" data-dpnav="-1" aria-label="Previous month">‹</button><b>${MONTHS[m]} ${y}</b><button type="button" data-dpnav="1" aria-label="Next month">›</button></div>
  <div class="dp-wd">${['M','T','W','T','F','S','S'].map(x=>`<span>${x}</span>`).join('')}</div><div class="dp-grid">${cells}</div>
  <div class="dp-foot"><button type="button" data-dpq="today">Today</button>${st.start?'<button type="button" data-dpq="start">Trip start</button>':''}<button type="button" data-dpq="clear">Clear</button></div>`}
function pickDP(iso){const inp=document.getElementById(dpS.id);const b=dpBtn();closeDP();if(!inp)return;inp.value=iso;
  if(b)b.innerHTML=(iso?esc(fdl(iso)):'<span class="muted">Pick a date</span>')+'<span aria-hidden="true">📅</span>';
  inp.dispatchEvent(new Event('change',{bubbles:true}))}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-dp]');
  if(b){e.preventDefault();e.stopPropagation();if(dpS&&dpS.id===b.dataset.dp)closeDP();else openDP(b);return}
  if(dpS&&dpEl.contains(e.target)){e.stopPropagation();const t=e.target.closest('button');if(!t)return;
    if(t.dataset.dpnav){dpS.m+=+t.dataset.dpnav;if(dpS.m<0){dpS.m=11;dpS.y--}if(dpS.m>11){dpS.m=0;dpS.y++}renderDP();placeDP()}
    else if(t.dataset.dpd)pickDP(t.dataset.dpd);
    else if(t.dataset.dpq==='today')pickDP(todayISO());else if(t.dataset.dpq==='start')pickDP(ST().start);else if(t.dataset.dpq==='clear')pickDP('');
    return}
  if(dpS)closeDP();
},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&dpS){e.stopImmediatePropagation();closeDP()}},true);
window.addEventListener('scroll',()=>{if(dpS)placeDP()},true);window.addEventListener('resize',()=>{if(dpS)placeDP()});
window.addEventListener('online',()=>render(true));window.addEventListener('offline',()=>render(true));
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(e=>console.warn('sw',e)))}
init();
</script>
